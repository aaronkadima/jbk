name: JBK web • produção e desenvolvimento
on:
  push:
    branches: [main, development]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: jbk-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout production
        uses: actions/checkout@v4
        with:
          ref: main
          path: production
      - name: Checkout development
        uses: actions/checkout@v4
        with:
          ref: development
          path: development
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            production/package-lock.json
            development/package-lock.json
      - name: Build production
        working-directory: production
        run: |
          npm ci
          npm run build -w web -- --base /jbk/
      - name: Build development
        working-directory: development
        run: |
          npm ci
          npm run build -w web -- --base /jbk/dev/
      - name: Assemble pages
        run: |
          mkdir -p pages/dev
          cp -R production/web/dist/. pages/
          cp -R development/web/dist/. pages/dev/
          touch pages/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages
      - name: Deploy GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
