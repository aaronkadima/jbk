name: JBK | Web production and development
on:
  push:
    branches:
      - main
      - development
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: jbk-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build and deploy both environments
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout production (main)
        uses: actions/checkout@v4
        with:
          ref: main
          path: production

      - name: Checkout development
        uses: actions/checkout@v4
        with:
          ref: development
          path: development

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            production/package-lock.json
            development/package-lock.json

      - name: Install production dependencies
        working-directory: production
        run: npm ci --no-audit --no-fund

      - name: Verify production TypeScript
        working-directory: production/web
        run: npx tsc --noEmit

      - name: Build production at /jbk/
        working-directory: production/web
        run: npx vite build --base=/jbk/

      - name: Install development dependencies
        working-directory: development
        run: npm ci --no-audit --no-fund

      - name: Verify development TypeScript
        working-directory: development/web
        run: npx tsc --noEmit

      - name: Build development at /jbk/dev/
        working-directory: development/web
        run: npx vite build --base=/jbk/dev/

      - name: Assemble static pages
        shell: bash
        run: |
          set -euo pipefail
          test -f production/web/dist/index.html
          test -f development/web/dist/index.html
          mkdir -p pages/dev
          cp -a production/web/dist/. pages/
          cp -a development/web/dist/. pages/dev/
          touch pages/.nojekyll
          echo "Production: $(test -f pages/index.html && echo OK)"
          echo "Development: $(test -f pages/dev/index.html && echo OK)"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
